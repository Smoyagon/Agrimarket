<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Iniciar sesión · AgriMarket</title>
<link rel="stylesheet" href="styles.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
</head>
<body>
  <header class="nav">
    <a class="brand" href="index.html"><img src="assets/logo.png" alt="">AgriMarket</a>
  </header>

  <main class="centro">
    <section class="login" aria-labelledby="t">
      <img class="logo" src="assets/logo.png" alt="">
      <h1 id="t">Iniciar sesión</h1>
      <p class="sub">Bienvenido de nuevo a AgriMarket</p>

      <form novalidate>
        <div class="campo">
          <label for="correo">Correo electrónico</label>
          <div class="input">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>
            <input id="correo" type="email" placeholder="tu@correo.com" autocomplete="email" required>
          </div>
        </div>

        <div class="campo">
          <div class="fila"><label for="clave">Contraseña</label><a href="#">¿Olvidaste tu contraseña?</a></div>
          <div class="input">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
            <input id="clave" type="password" value="••••••••••" autocomplete="current-password" required>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-label="Mostrar contraseña"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
          </div>
        </div>

        <a class="btn btn-primario btn-bloque" href="mis-productos.html" role="button">Entrar</a>
      </form>

      <div class="separador">o</div>
      <p class="pie-login">¿No tienes cuenta? <a href="#">Regístrate</a></p>
    </section>
  </main>
</body>
</html>
